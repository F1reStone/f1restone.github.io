name: CI and deploy

on:
  push:
    branches: [main, as260]
  pull_request:
    branches: [main, as260]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  SITE_URL: https://fire-stone.co/

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Lint
        run: pnpm lint
      - name: Astro and TypeScript check
        run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Unit tests
        run: pnpm test:run

  build:
    name: Build
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project

      - name: Production build
        run: pnpm build
        env:
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          REPOSITORY_ID: ${{ secrets.REPOSITORY_ID }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID }}

      - name: Install test browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Test production pages in browser
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/playwright-production

      - name: Test bilingual routes and shared UI
        run: pnpm test:i18n
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results/playwright-i18n

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            test-results/playwright-production/
            test-results/playwright-i18n/
          if-no-files-found: ignore
          retention-days: 7

      # Only publish the production output after both browser suites pass.
      # A tar archive also preserves dotfiles such as .well-known across jobs.
      - name: Package verified production site
        run: tar -cf site.tar -C dist .

      - name: Upload verified production site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-site-${{ github.sha }}
          path: site.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project

      # Download only this run's verified artifact; never rebuild at deployment.
      - name: Download verified production site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-site-${{ github.sha }}

      - name: Restore production site
        run: |
          mkdir -p dist
          tar -xf site.tar -C dist
          test -s dist/index.html

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
