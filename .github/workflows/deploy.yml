name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
      GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
      REPOSITORY_ID: ${{ secrets.REPOSITORY_ID }}
      CATEGORY_ID: ${{ secrets.CATEGORY_ID }}
      SITE_URL: https://fire-stone.co/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Configure pnpm safety for CI/CD
        run: pnpm config set ignore-workspace-root-check true

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}